<!DOCTYPE html>
<html>
<head>
    <title>NoteFinder — Engineering Notes Search</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <h1>📚 NoteFinder</h1>
    <p class="subtitle">Search Engineering Notes from the Internet</p>

    <form action="/search" class="search-box">
        <input type="text" name="q" placeholder="Search DSA, OS, CN, DBMS Notes..." required>

    <div class="features">

        <div class="card">📄 PDF Links</div>
        <div class="card">🎓 Student Friendly</div>
    </div>

    <footer>
        Built by <b>Maddy</b> 💙 | API Powered Notes Search
    </footer>
</div>

</body>
</html>
